name: tests

on:
  pull_request:          # every PR, including PRs stacked on another feature branch
  push:
    branches: [next, main]

permissions:
  contents: read

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest   # the docx2pdf / Word path in pdf_export.py
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      JOBHUNT_OFFLINE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
