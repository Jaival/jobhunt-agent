name: release

# Pushing a tag vX.Y.Z (docs/RELEASING.md step 7) checks it against VERSION and CHANGELOG.md, reruns the tests and
# creates the GitHub Release from the tag's CHANGELOG section.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python tools/release_notes.py "$GITHUB_REF_NAME"

  tests:
    needs: check
    uses: ./.github/workflows/tests.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title=$(python tools/release_notes.py "$GITHUB_REF_NAME" --out notes.md)
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$title" --notes-file notes.md
