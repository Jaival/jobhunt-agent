# Personal settings for the jobhunt-agent tools (engine/tools/config.py). Keep this file in your private workspace.
config_version: 2                               # set by the engine; "update the engine" migrates older files
applicant: Your Name                            # document author / ATS name, first line of the CV
file_prefix: Your_Name                          # <file_prefix>_CV_<short>.docx
master_cv: cv/Your_Name_CV.docx                 # your own CV design; cv/layout.yaml maps it (cv/README.txt)
master_letter: cv/Your_Name_CoverLetter.docx
variants: cv/variants.yaml
letter_city: Berlin                             # letter date line "Berlin, DD.MM.YYYY"
letter_languages: [en]                          # [en], [de] or [de, en]: one letter per language per application
name_in_master: ""                              # optional: your name as the master CV/letter spell it, if documents
                                                # should say `applicant` instead (e.g. without a middle name)
university: TU Berlin                           # student letters must mention it (leave empty for none); a list
                                                # accepts any of its names: [TU Berlin, Technische Universität Berlin]
font: Open Sans                                 # font for CV and letter
fallback_font: Open Sans                        # substitute named in the font table
search:
  home: {wo: Berlin, umkreis: 50}               # Arbeitsagentur home-area pass (plus a nationwide pass)
  # areas: [{wo: München, umkreis: 50}, {wo: Nürnberg, umkreis: 50}]   # optional: these passes instead of nationwide
  # regions: [Bayern]                           # optional: keep only jobs in these federal states
  # region_plz: ['8', '90', '91', '92', '93', '94', '95', '96', '97']  # postcode starts, for ads without a region
  # region_places: [München, Nürnberg, Augsburg, Regensburg]          # place names, for other job sites
profile:                                        # which job titles search_jobs.py keeps (engine/tools/scope.py)
  # Each entry is a word (or regular-expression fragment) matched anywhere in the title, upper/lower case ignored.
  # Onboarding fills this in from your answers; the examples below are for a marketing student.
  role_types: [Werkstudent, Internship, Junior]          # pick from Werkstudent, HiWi, Internship, Thesis, Junior
  include_titles: [your field]                            # e.g. [marketing, content, social media, kommunikation]
  junior_include_titles: []                               # optional: a narrower list for junior roles
  junior_exclude_titles: []                               # optional: extra words to drop for junior roles
  exclude_titles: [senior, '\blead\b', principal, head of, director, manager, leiter, ausbildung, azubi,
                   unsolicited, initiativ]                # seniority words; add fields you never want
  score_bonus: []                                         # skills that add points when scoring, e.g. [SEO, Canva]
# scoring:                                       # optional: change the fit score (engine/tools/score.py, engine/rubric.md)
#   weights: {seniority: 1, language: 1, location: 1, hours: 1}   # how much each one's deduction counts
#   blockers: [seniority, language, location, hours]   # a 0 for these is a hard mismatch (score halved)
#   bonus_points: 3                               # per score_bonus skill the ad names, at most two
layout: cv/layout.yaml                          # CV map (engine/tools/cv_map.py); 'none' = drafts only, no documents
internship_duration: ""                         # e.g. 6 months; internship letters must then state it
pdf_engine: auto                                # auto (Word if installed, else LibreOffice) | word | libreoffice | none
ledger_expiry_days: 90                          # a screened/skipped/closed job counts as new again after this (0 = never)
